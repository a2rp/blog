<svg width="1400" height="420" viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .t{font:600 18px Inter, system-ui; fill:#f3f4f6}
    .s{font:400 14px Inter, system-ui; fill:#a0a0a7}
    .box{fill:#121214;stroke:#262626;stroke-width:1.5;rx:12;ry:12}
    .acc{fill:#5aa9ff}
  </style>
  <rect width="100%" height="100%" fill="#0b0b0b"/>
  <text x="700" y="40" text-anchor="middle" class="t" font-size="24">Common AI flow: Ingest → Chunk → Embed → Retrieve → Rerank → Prompt → Stream → Evaluate</text>

  <!-- Boxes -->
  <g transform="translate(60,100)">
    <rect class="box" x="0" y="0" width="150" height="90"/>
    <text x="75" y="35" class="t" text-anchor="middle">Ingest</text>
    <text x="75" y="62" class="s" text-anchor="middle">Markdown/JSX</text>
  </g>
  <g transform="translate(230,100)">
    <rect class="box" x="0" y="0" width="150" height="90"/>
    <text x="75" y="35" class="t" text-anchor="middle">Chunk</text>
    <text x="75" y="62" class="s" text-anchor="middle">semantic/fixed</text>
  </g>
  <g transform="translate(400,100)">
    <rect class="box" x="0" y="0" width="150" height="90"/>
    <text x="75" y="35" class="t" text-anchor="middle">Embed</text>
    <text x="75" y="62" class="s" text-anchor="middle">vectors</text>
  </g>
  <g transform="translate(570,100)">
    <rect class="box" x="0" y="0" width="150" height="90"/>
    <text x="75" y="35" class="t" text-anchor="middle">Retrieve</text>
    <text x="75" y="62" class="s" text-anchor="middle">cosine/top-k</text>
  </g>
  <g transform="translate(740,100)">
    <rect class="box" x="0" y="0" width="150" height="90"/>
    <text x="75" y="35" class="t" text-anchor="middle">Rerank</text>
    <text x="75" y="62" class="s" text-anchor="middle">quality pass</text>
  </g>
  <g transform="translate(910,100)">
    <rect class="box" x="0" y="0" width="150" height="90"/>
    <text x="75" y="35" class="t" text-anchor="middle">Prompt</text>
    <text x="75" y="62" class="s" text-anchor="middle">context+task</text>
  </g>
  <g transform="translate(1080,100)">
    <rect class="box" x="0" y="0" width="150" height="90"/>
    <text x="75" y="35" class="t" text-anchor="middle">Stream</text>
    <text x="75" y="62" class="s" text-anchor="middle">tokens</text>
  </g>
  <g transform="translate(1250,100)">
    <rect class="box" x="0" y="0" width="150" height="90"/>
    <text x="75" y="35" class="t" text-anchor="middle">Evaluate</text>
    <text x="75" y="62" class="s" text-anchor="middle">nDCG/ROUGE</text>
  </g>

  <!-- Arrows -->
  <g stroke="#5aa9ff" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#5aa9ff"/>
      </marker>
    </defs>
    <line x1="210" y1="145" x2="230" y2="145"/>
    <line x1="380" y1="145" x2="400" y2="145"/>
    <line x1="550" y1="145" x2="570" y2="145"/>
    <line x1="720" y1="145" x2="740" y2="145"/>
    <line x1="890" y1="145" x2="910" y2="145"/>
    <line x1="1060" y1="145" x2="1080" y2="145"/>
    <line x1="1230" y1="145" x2="1250" y2="145"/>
  </g>
</svg>
